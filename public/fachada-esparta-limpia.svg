<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 350" role="img" aria-label="Ilustración de la fachada del modelo Esparta">
  <!-- Elevación principal de la Casa Modelo Esparta, sin cotas ni notas (tarjeta de casa vendida).
       Escala: 100 unidades = 1 m. Sala 2.40 m (terracota) + corredor 2.60 m (bloque visto), muro
       del frente a 3.20 m con pretil de 0.60 m. Ventanas: sala 0.80 × 1.10 y Dormitorio 1
       1.20 × 1.10, antepecho 1.00 m. Referencia: public/fachada-esparta.png. -->
  <rect width="540" height="350" fill="#ffffff"/>
  <g transform="translate(20 12)">
    <!-- Remate del pretil -->
    <rect x="-2" y="0" width="504" height="6" fill="#e2ddd6" stroke="#857a6d" stroke-width="1"/>
    <!-- Sala: bloque en terracota -->
    <rect x="0" y="6" width="240" height="314" fill="#b0502c"/>
    <line x1="0" y1="66" x2="240" y2="66" stroke="#8c3d20" stroke-width="1.5"/>
    <!-- Ventana de la sala con marco claro -->
    <rect x="34" y="104" width="92" height="122" fill="#f4e3da"/>
    <rect x="40" y="110" width="80" height="110" fill="#bcd3dd" stroke="#37322d" stroke-width="5"/>
    <line x1="80" y1="110" x2="80" y2="220" stroke="#37322d" stroke-width="3"/>
    <!-- Jardinera baja de bloque con arbustos -->
    <rect x="16" y="272" width="208" height="48" fill="#bdb3a6" stroke="#857a6d" stroke-width="1"/>
    <g fill="#6f8f4e" stroke="#4f6a36" stroke-width="1">
      <circle cx="36" cy="266" r="14"/><circle cx="70" cy="264" r="15"/><circle cx="104" cy="266" r="14"/>
      <circle cx="138" cy="264" r="15"/><circle cx="172" cy="266" r="14"/><circle cx="204" cy="265" r="13"/>
    </g>
    <!-- Corredor: pretil claro arriba y bloque visto sellado -->
    <rect x="240" y="6" width="260" height="60" fill="#efe9df"/>
    <rect x="240" y="66" width="260" height="254" fill="#cfc8bd"/>
    <g stroke="#b9b0a3" stroke-width="1">
      <line x1="240" y1="86" x2="476" y2="86"/><line x1="240" y1="106" x2="476" y2="106"/>
      <line x1="240" y1="126" x2="476" y2="126"/><line x1="240" y1="146" x2="476" y2="146"/>
      <line x1="240" y1="166" x2="476" y2="166"/><line x1="240" y1="186" x2="476" y2="186"/>
      <line x1="240" y1="206" x2="476" y2="206"/><line x1="240" y1="226" x2="476" y2="226"/>
      <line x1="240" y1="246" x2="476" y2="246"/><line x1="240" y1="266" x2="476" y2="266"/>
      <line x1="240" y1="286" x2="476" y2="286"/><line x1="240" y1="306" x2="476" y2="306"/>
    </g>
    <!-- Ventana del Dormitorio 1 con marco claro -->
    <rect x="284" y="104" width="132" height="122" fill="#f7f5f2"/>
    <rect x="290" y="110" width="120" height="110" fill="#bcd3dd" stroke="#37322d" stroke-width="5"/>
    <line x1="350" y1="110" x2="350" y2="220" stroke="#37322d" stroke-width="3"/>
    <!-- Columna oscura del corredor con su lámpara -->
    <rect x="476" y="66" width="18" height="254" fill="#37322d"/>
    <rect x="466" y="140" width="10" height="16" fill="#8a6a12"/>
    <!-- Paso del corredor y suelo -->
    <rect x="240" y="312" width="236" height="8" fill="#e2ddd6"/>
    <line x1="-14" y1="320" x2="514" y2="320" stroke="#514941" stroke-width="2"/>
  </g>
</svg>
